name: RG353V Edition APK

# Builds android-rg353v/ (a native Kotlin launcher for the ANBERNIC RG353V, independent of the
# website and of android-app/), runs its unit tests, uploads the APK as an artifact and, when
# `release` is true, publishes it as a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true
      tag:
        description: "Release tag"
        default: "rg353v-v1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-rg353v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Name the APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" EmuRM-RG353V-v1.0.apk
          ls -la EmuRM-RG353V-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EmuRM-RG353V-v1.0
          path: android-rg353v/EmuRM-RG353V-v1.0.apk
      - name: Publish release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" EmuRM-RG353V-v1.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" EmuRM-RG353V-v1.0.apk --repo "$GITHUB_REPOSITORY" \
              --title "EmuRM RG353V Edition v1.0" \
              --notes-file android-rg353v/RELEASE_NOTES.md
          fi
