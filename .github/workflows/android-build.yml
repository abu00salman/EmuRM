name: Android Debug APK

# Builds the android-app/ project into an installable debug APK.
#
# This exists because the environment this workflow was written from couldn't build
# the project itself: Android's own SDK/build-tools can only be fetched from Google's
# Maven host (dl.google.com), which that environment's network policy blocked. GitHub's
# own hosted runners have no such restriction and ship with the Android SDK already
# installed, so the build happens here instead — triggered manually, with the result
# attached to the run as a downloadable artifact rather than committed to the repo.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: emurm-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
