name: Validate web and Android

on:
  push:
    branches: [redesign-console-lounge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No separate Android SDK setup action here: ubuntu-latest already ships a
      # working SDK with licenses pre-accepted (android-build.yml has built and
      # signed a real APK against it with nothing more than setup-java). An
      # earlier version of this workflow added android-actions/setup-android@v3
      # here, which failed outright — it tries to install the legacy top-level
      # "tools" package, removed from Google's SDK repository years ago.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sram
      - run: npm run test:msx
      - run: npm run build
      - name: Gradle build and debug APK
        working-directory: android-app
        run: bash ./gradlew --no-daemon build assembleDebug
      - name: Verify APK signatures and packaging
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$SIGNER" verify --verbose --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emurm-phone-tablet-tv-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: GitHub Pages basePath build
        run: npm run build
        env:
          NEXT_BASE_PATH: /EmuRM
